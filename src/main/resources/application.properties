spring.application.name=feature-flag
server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/feature_flag_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# JWT — override in any real environment via the APP_JWT_SECRET env var.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!}
app.jwt.expiration-minutes=60
